[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medclear_crew"
version = "0.1.0"
description = "Autonomous Prescription Simplifier & Caregiver Routine Planner Swarm powered by Groq"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai>=0.86.0",
    "crewai-tools>=0.14.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.1",
    "tabulate>=0.9.0",
    "groq>=0.11.0",
    "litellm>=1.50.0"
]

[project.scripts]
medclear = "medclear_crew.main:run"
run_crew = "medclear_crew.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/medclear_crew"]
